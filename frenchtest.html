<!DOCTYPE html>
<html>
<body>

<h1>French Test</h1>

<p>Click the button to start the test, fill nothing to end the test</p>

<button onclick="testDeVerbes()">Verbes</button>

<p id="demo"></p>

<script>
function getRandomInt(max) {
  return Math.floor(Math.random() * max);
} //getRandomInt(3) returns 0, 1 or 2

let pronoms = ["je", "tu", "il/elle", "nous", "vous", "ils/elles"];
let verbes = [
  ["faire",      "fais",      "fais",       "fait",      "faisons",        "faites",        "font"         ],
  ["boire",      "bois",      "bois",       "boit",      "buvons",         "buvez",         "boivent"      ],
  ["manger",     "mange",     "manges",     "mange",     "mangeons",       "mangez",        "mangent"      ],
  ["pouvoir",    "peux",      "peux",       "peut",      "pouvons",        "pouvez",        "peuvent"      ],
  ["devoir",     "dois",      "dois",       "doit",      "devons",         "devez",         "doivent"      ],
  ["vouloir",    "veux",      "veux",       "veut",      "voulons",        "voulez",        "veulent"      ],
  ["prendre",    "prends",    "prends",     "prend",     "prenons",        "prenez",        "prennent"     ],
  ["apprendre",  "apprends",  "apprends",   "apprend",   "apprenons",      "apprenez",      "apprennent"   ],
  ["comprendre", "comprends", "comprends",  "comprend",  "comprenons",     "comprenez",     "comprennent"  ],
  ["être",       "suis",      "es",         "est",       "sommes",         "êtes",          "sont"         ],
  ["avoir",      "ai",        "as",         "a",         "avons",          "avez",          "ont"          ],
  ["aller",      "vais",      "vas",        "va",        "allons",         "allez",         "vont"         ],
  ["écouter",    "écoute",    "écoutes",    "écoute",    "écoutons",       "écoutez",       "écoutent"     ],
  ["se coucher", "me couche", "te couches", "se couche", "nous couchons",  "vous couchez",  "se couchent"  ],
  ["se lever",   "me lève",   "te lèves",   "se lève",   "nous levons",    "vous levez",    "se lèvent"    ],
  ["s'habiller", "m'habille", "t'habilles", "s'habille", "nous habillons", "vous habillez", "se habillent" ],
  ["lire",       "lis",       "lis",        "lit",       "lisons",         "lisez",         "lisent"       ],
  ["écrire",     "écris",     "écris",      "écrit",     "écrivons",       "écrivez",       "écrivent"     ],
  ["dormir",     "dors",      "dors",       "dort",      "dormons",        "dormez",        "dorment"      ],
  ["savoir",     "sais",      "sais",       "sait",      "savons",         "savez",         "savent"       ],
  ["attendre",   "attends",   "attends",    "attend",    "attendons",      "attendez",      "attendent"    ],
  ["venir",      "viens",     "viens",      "vient",     "venons",         "venez",         "viennent"     ],
  ["connaître",  "connais",   "connais",    "connaît",   "connaissons",    "connaissez",    "connaissent"  ]
];

function testDeVerbes() {
  let cycle = false;
  while (cycle != true) {
    let pronom_courant_index = getRandomInt(6);
    let verbe_courant_index = getRandomInt(23);
    let pronom_courant = pronoms[pronom_courant_index];
    let infinitif_courant = verbes[verbe_courant_index][0];
    let verbe_courant = verbes[verbe_courant_index][prononce_courant_index+1];
    
    let reponse = prompt("Enter the form corresponding to the pronounce and given infinitive \n" +
                         "Type nothing to end the test \n\n" +
                         prononce_courant + " " + infinitif_courant + "?", undefined);
    if ((reponse != undefined) && (reponse != "")) {
      if (reponse == verbe_courant) {
        alert("Right! +");
      } else {
        alert("Wrong. -");
      }
    } else {
      alert("Ending.");
      cycle = true;
    }
  }
}
</script>

</body>
</html>
